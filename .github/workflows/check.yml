name: Check template
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify committed HTML and local assets
        run: |
          node scripts/build.mjs --check
          node scripts/check.mjs
          node --check main.js
